<!-- Botón para mostrar el menú en dispositivos móviles -->
<button id="showSidebar" class="btn btn-success d-md-none position-fixed" style="top: 10px; left: 10px; z-index: 1020; display: none;">
    <i class="bi bi-list"></i>
    
</button>

<style>
    .sidebar.sidebar-dueno { background: #28a745 !important; background-image: none !important; max-height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .sidebar.sidebar-dueno .active { background-color: rgba(255, 255, 255, 0.2); border-left: 4px solid white; }
    .sidebar.sidebar-dueno a:hover { background-color: rgba(255, 255, 255, 0.1); }
    @media (max-width: 767.98px) {
        .sidebar.sidebar-dueno { transform: translateX(-100%); height: 100vh; max-height: 100vh; overflow-y: auto; padding-bottom: 60px; }
        .sidebar.sidebar-dueno.show { transform: translateX(0); }
        #showSidebar { display: block !important; }
    }
    .menu-items a { margin-bottom: 5px; }
    .menu-items { display: flex; flex-direction: column; }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const sidebarToggle = document.getElementById('sidebarToggle');
        const showSidebar = document.getElementById('showSidebar');
        const sidebar = document.querySelector('.sidebar');
        if (sidebarToggle && showSidebar && sidebar) {
            sidebarToggle.addEventListener('click', function() { sidebar.classList.remove('show'); });
            showSidebar.addEventListener('click', function() { sidebar.classList.add('show'); });
        }
    });
</script>
